{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <title>{{.Title}} — unimatrix</title>
  <style>
    :root {
      --bg: #0a0e0a;
      --bg-elev: #11181a;
      --fg: #c8e6c9;
      --fg-dim: #6b8b70;
      --accent: #5fffaf;
      --accent-dim: #1a4a2a;
      --danger: #ff5e7a;
      --border: #1f2c22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--fg);
      background: var(--bg);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    header .brand {
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    header nav { margin-left: auto; display: flex; gap: 14px; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
    h1 {
      font-size: 18px;
      margin: 0 0 16px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .flash {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 10px 14px;
      margin-bottom: 16px;
      border-left: 3px solid var(--accent);
    }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { color: var(--fg-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type=text], input[type=password], textarea {
      background: var(--bg-elev);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
    }
    input:focus, textarea:focus { outline: 1px solid var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    button {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    button:hover { background: var(--accent); color: var(--bg); }
    button.inline {
      background: none;
      border: none;
      color: var(--fg-dim);
      padding: 0;
      letter-spacing: 0;
      text-transform: none;
    }
    button.inline:hover { color: var(--danger); background: none; }
    .transmission {
      border-bottom: 1px dashed var(--border);
      padding: 14px 0;
    }
    .transmission .meta {
      color: var(--fg-dim);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .transmission .meta .designation { color: var(--accent); }
    .transmission .body { white-space: pre-wrap; word-break: break-word; }
    .compose { margin-bottom: 24px; padding: 14px; background: var(--bg-elev); border: 1px solid var(--border); }
    footer {
      color: var(--fg-dim);
      font-size: 11px;
      text-align: center;
      padding: 30px 0;
      letter-spacing: 0.05em;
    }
  </style>
  <script>
    // Dark mode handling
    document.addEventListener('DOMContentLoaded', function() {
      const toggle = document.getElementById('dark-mode-toggle');
      if (toggle) {
        // Check for saved preference
        const prefersDark = localStorage.getItem('darkMode') === 'true';
        const isDark = prefersDark;
        
        if (isDark) {
          document.body.classList.add('dark-mode');
          toggle.textContent = '☀️';
        }
        
        // Toggle function
        toggle.addEventListener('click', function() {
          document.body.classList.toggle('dark-mode');
          const isDark = document.body.classList.contains('dark-mode');
          localStorage.setItem('darkMode', isDark);
          toggle.textContent = isDark ? '☀️' : '🌙';
        });
      }
    });
  </script>
  <script>
    // Keyboard shortcuts for navigation
    document.addEventListener('keydown', function(e) {
      // Don't trigger shortcuts when typing in form fields
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      // Don't trigger when modifier keys are held (e.g., Ctrl+R reload)
      if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
      switch (e.key.toLowerCase()) {
        case 'h': window.location.href = '/'; break;
        case 'l': window.location.href = '/login'; break;
        case 'r': window.location.href = '/register'; break;
        case 'a': window.location.href = '/about'; break;
      }
    });
  </script>
</head>
<body>
  <header>
    <a class="brand" href="/">unimatrix</a>
    <nav>
      {{if .Drone}}
        <span style="color: var(--fg-dim)">{{.Drone.Designation}} (assimilated: {{.Drone.CreatedAt.Format "2006-01-02"}})</span>
        <form method="post" action="/logout" style="display:inline">
          <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
          <button class="inline" type="submit">logout</button>
        </form>
      {{else}}
        <a href="/login">connect</a>
        <a href="/register">assimilate</a>
      {{end}}
    </nav>
  </header>
  <main>
    {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
    {{template "content" .}}
  </main>
  <footer>RESISTANCE IS FUTILE · built by drones · <a href="https://github.com/FlorianWenzel/unimatrix">source</a></footer>
  <script>
    // Convert UTC timestamps to local time
    document.addEventListener('DOMContentLoaded', function() {
      const timeElements = document.querySelectorAll('time[data-created-at]');
      timeElements.forEach(function(timeEl) {
        const utcString = timeEl.getAttribute('data-created-at');
        const date = new Date(utcString);
        // Format as local time
        timeEl.textContent = date.toLocaleString();
      });
      
      // Character count for transmission textarea
      const textarea = document.getElementById('body');
      const charCount = document.getElementById('char-count');
      if (textarea && charCount) {
        function updateCharCount() {
          const currentLength = textarea.value.length;
          const maxLength = parseInt(textarea.getAttribute('maxlength'));
          charCount.textContent = currentLength + '/' + maxLength;
          
          // Change color based on how close we are to the limit
          if (currentLength > maxLength * 0.9) {
            charCount.style.color = '#ff5e7a'; // danger color when near limit
          } else {
            charCount.style.color = 'var(--fg-dim)';
          }
        }
        
        // Update on input events
        textarea.addEventListener('input', updateCharCount);
        // Initialize on page load
        updateCharCount();
      }
      
      // Copy link functionality
      document.addEventListener('click', function(e) {
        if (e.target.classList.contains('copy-link')) {
          const transmissionId = e.target.getAttribute('data-id');
          if (transmissionId) {
            const url = window.location.origin + '/transmission/' + transmissionId;
            navigator.clipboard.writeText(url).then(() => {
              // Visual feedback
              const originalText = e.target.textContent;
              e.target.textContent = 'copied!';
              setTimeout(() => {
                e.target.textContent = originalText;
              }, 2000);
            }).catch(err => {
              console.error('Failed to copy: ', err);
            });
          }
        }
      });
    });
  </script>
</body>
</html>
{{end}}
